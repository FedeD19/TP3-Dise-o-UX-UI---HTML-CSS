<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 19 - Formulario multi-step con validación visual</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Crear cuenta</h1>

  <!-- Radios ocultos que controlan qué paso se muestra -->
  <input type="radio" name="paso" id="paso1" class="paso-radio" checked>
  <input type="radio" name="paso" id="paso2" class="paso-radio">

  <div class="indicador">
    <label for="paso1" class="punto">1. Datos personales</label>
    <label for="paso2" class="punto">2. Contraseña</label>
  </div>

  <form action="#" method="post" class="formulario" novalidate>
    <fieldset class="paso paso-uno">
      <legend>Paso 1: Datos personales</legend>

      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required minlength="2">
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
      </div>

      <label for="paso2" class="btn btn-siguiente">Siguiente</label>
    </fieldset>

    <fieldset class="paso paso-dos">
      <legend>Paso 2: Contraseña</legend>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8">
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" placeholder="Repetí la contraseña" required minlength="8">
      </div>

      <div class="acciones">
        <label for="paso1" class="btn btn-atras">Atrás</label>
        <button type="submit" class="btn btn-enviar">Registrarme</button>
      </div>
    </fieldset>
  </form>
</body>
</html>
