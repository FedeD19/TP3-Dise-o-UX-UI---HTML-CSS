<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 9 - Flexbox: galería de tarjetas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Accesorios para programar</h1>

  <div class="galeria">
    <div class="producto">
      <img src="img/teclado.svg" alt="Teclado mecánico">
      <h2>Teclado mecánico</h2>
      <p class="precio">$45.000</p>
      <button>Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="img/mouse.svg" alt="Mouse ergonómico">
      <h2>Mouse ergonómico</h2>
      <p class="precio">$18.500</p>
      <button>Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="img/auriculares.svg" alt="Auriculares con micrófono">
      <h2>Auriculares con mic</h2>
      <p class="precio">$32.000</p>
      <button>Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="img/monitor.svg" alt="Monitor de 24 pulgadas">
      <h2>Monitor 24"</h2>
      <p class="precio">$210.000</p>
      <button>Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="img/taza.svg" alt="Taza de café para programadores">
      <h2>Taza "Hello World"</h2>
      <p class="precio">$6.000</p>
      <button>Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="img/cuaderno.svg" alt="Cuaderno para anotar código">
      <h2>Cuaderno de apuntes</h2>
      <p class="precio">$4.500</p>
      <button>Agregar al carrito</button>
    </div>
  </div>
</body>
</html>
